name: Bug report
description: Something in Spec Deck parsed, drew, or acted wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to see it again. For a parser bug, paste a small excerpt you are allowed to share, with private names removed.
      placeholder: |
        1. Open a Spec Kit repo
        2. Select the spec
        3. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD` in this repo, or the build you ran.
      placeholder: abc1234
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
