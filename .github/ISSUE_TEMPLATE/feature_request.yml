name: Feature request
description: A change to what Spec Deck shows or does.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to see or do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. If this alters product behavior, name the part of specs/001-command-center/spec.md it would touch.
    validations:
      required: true
