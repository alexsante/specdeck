[package]
name = "spec-deck"
description = "Read-only command center for Spec Kit projects"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
comrak = { version = "0.59.0", default-features = false }
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
speckit-core = { path = "../../crates/speckit-core" }
tauri = "2.12.5"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
