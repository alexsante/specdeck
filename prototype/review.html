<title>Spec Deck PR review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/*__CSS__*/
/*__RVCSS__*/
.mockbar { max-width: 1360px; margin: 0 auto 12px; display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
.mockbar label { font-weight: 600; color: var(--fg); }
.mockbar select { font: inherit; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); max-width: 100%; }
.mockbar .hint { flex: 1 1 320px; min-width: 0; }
/* rendered markdown in the mockup (the app styles its own) */
.md { font-size: 13px; line-height: 1.55; padding: 12px 22px 18px 0; min-width: 0; }
.md p, .md ul, .md ol { margin: 0 0 8px; }
.md h1 { font-size: 19px; margin: 6px 0 8px; } .md h2 { font-size: 16px; margin: 18px 0 6px; } .md h3 { font-size: 14px; margin: 14px 0 4px; }
.md code { font-family: var(--mono); font-size: 11.5px; background: color-mix(in srgb, var(--fg) 8%, transparent); padding: 1px 4px; border-radius: 4px; }
.md table { border-collapse: collapse; font-size: 12.5px; margin: 0 0 8px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); }
.md > :not(.rv-thread):not(.rv-composer) { max-width: 76ch; }
</style>

<div class="mockbar">
  <label for="scenario">GitHub state</label>
  <select id="scenario">
    <option value="ready">Ready</option>
    <option value="nogh">GitHub CLI not installed</option>
    <option value="noauth">Not signed in</option>
    <option value="offline">Remote not responding</option>
    <option value="nopr">Branch has no PR</option>
    <option value="merged">PR merged</option>
    <option value="otherbranch">Another branch checked out</option>
    <option value="ahead">Local commits not pushed</option>
    <option value="dirty">spec.md edited locally</option>
  </select>
  <span class="hint">Mockup controls, outside the app window. Hover a paragraph and click <b>+</b> to comment; shift-click another <b>+</b> to stretch the range. Threads are sample data: PR #217 has no comments on its spec files yet. This page uses the same review code as the app.</span>
</div>
<div class="win" id="win">
  <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><div class="ttl">Spec Deck — proj-nava</div></div>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="main" id="main" style="padding-bottom:0"></main>
  </div>
  <div id="rvbar"></div>
</div>
<div id="rvdialog"></div>
<div class="toast" id="toast"></div>

<script>
/*__RVJS__*/
/*__RVMOCK__*/
const D = /*__DATA__*/null;
const FID = D.dir.split("/").pop();
const f = { id: FID, branch: D.branch };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let tt;
function toast(h) { const el = document.getElementById("toast"); el.innerHTML = h; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2600); }
const scenarioEl = document.getElementById("scenario");
const TABS = ["spec.md", "plan.md", "research.md", "data-model.md", "quickstart.md", "contracts", "tasks.md", "review.md"];
const backend = createMockBackend({ esc, me: D.me, repo: D.repo, branch: D.branch, feature: FID, pr: D.pr, files: D.files, threads: sampleThreads(D.me), scenario: () => scenarioEl.value });
const RV = createReview({
  backend, esc, toast, rerender: () => render(),
  openTab: tab => toast(`${esc(tab)} renders the same way in the app. This mockup shows spec.md.`),
  copy: text => navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject("Copy is blocked here; the app uses the system clipboard."),
  openUrl: url => window.open(url, "_blank", "noopener"),
});

// spec.md as blocks carrying data-sourcepos, the way comrak marks them in the app.
const docHtml = (() => {
  const toks = marked.lexer(D.spec), box = document.createElement("div");
  let line = 1;
  const nl = s => (s.match(/\n/g) || []).length;
  const endOf = (start, raw) => start + nl(raw.replace(/\n+$/, ""));
  for (const tok of toks) {
    if (tok.type === "space") { line += nl(tok.raw); continue; }
    const arr = [tok]; arr.links = toks.links;
    const t = document.createElement("template");
    t.innerHTML = marked.parser(arr).trim();
    const el = t.content.firstElementChild;
    if (el) {
      el.dataset.sourcepos = `${line}:1-${endOf(line, tok.raw)}:1`;
      if (tok.type === "list") {
        let l = line;
        [...el.children].forEach((li, i) => { const raw = tok.items[i]?.raw || ""; li.dataset.sourcepos = `${l}:1-${endOf(l, raw)}:1`; l += nl(raw); });
      }
      box.appendChild(el);
    }
    line += nl(tok.raw);
  }
  return box.innerHTML;
})();

function render() {
  const n = RV.counts()[FID];
  document.getElementById("side").innerHTML = `
    <div class="proj" style="padding:0 8px"><span class="ic">P</span><b>proj-nava</b></div>
    <div><h6>Views</h6><div class="nav"><button>All specs<span class="n">104</span></button><button>Waiting on me<span class="n">9</span></button>
      <button class="on">Open review threads<span class="n">${n ?? ""}</span></button><button>Timeline</button></div></div>`;
  document.getElementById("main").innerHTML = `
    <div class="crumbs"><button>‹ proj-nava</button><span>/</span><span class="mono">${esc(FID.split("-")[0])}</span><span>/</span><span class="mono">${esc(FID.split("-").slice(1).join("-"))}</span></div>
    <div class="spechead"><div style="min-width:0;flex:1 1 380px">
      <h1>Campaign budgeting</h1>
      <div class="meta"><span class="pill">Analyzed</span><span class="tk">${esc(FID.split("-")[0])}</span><span class="mono">⎇ ${esc(D.branch)}</span>${RV.chip(f)}<span>Created 2026-11-07</span></div></div>
      <div class="actions"><button class="btn">Open folder</button><button class="btn primary">Copy /speckit-implement</button></div></div>
    ${RV.line(f, "spec.md")}
    ${RV.grid(f, `<div class="card panel docs"><header>Documents<span class="r">${D.files.length} files in this spec</span></header>
      <div class="tabs">${TABS.map((x, i) => `<button class="${i === 0 ? "on" : ""}" data-tab="${x}">${x}${RV.tabCount(f, x)}</button>`).join("")}</div>
      <div class="md" id="doc" data-file="spec.md">${docHtml}</div></div>`)}
    <div style="height:18px"></div>`;
  RV.afterRender(f, "spec.md");
}

document.addEventListener("click", e => {
  if (RV.click(e)) return;
  const t = e.target.closest("[data-tab]");
  if (t && t.dataset.tab !== "spec.md") toast(`${esc(t.dataset.tab)} renders the same way in the app. This mockup shows spec.md.`);
});
document.addEventListener("keydown", e => { RV.key(e); });
scenarioEl.addEventListener("change", () => RV.load(f, false));
RV.loadCounts();
render();
</script>
