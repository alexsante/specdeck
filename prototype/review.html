<title>Spec Deck PR review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/*__CSS__*/

/* ---------- review on GitHub (mockup additions) ---------- */
.mockbar { max-width: 1360px; margin: 0 auto 12px; display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
.mockbar label { font-weight: 600; color: var(--fg); }
.mockbar select { font: inherit; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); max-width: 100%; }
.mockbar .hint { flex: 1 1 320px; min-width: 0; }
.gh { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); margin: 12px 0 14px; font-size: 12.5px; flex-wrap: wrap; }
.gh .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.gh.off .lamp { background: var(--warn); }
.gh .msg { flex: 1 1 300px; min-width: 0; }
.gh code, .composer code, .rv code { font-family: var(--mono); font-size: 11.5px; background: color-mix(in srgb, var(--fg) 8%, transparent); padding: 1px 5px; border-radius: 4px; }
.prchip { display: inline-flex; gap: 6px; align-items: center; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 11.5px; color: var(--fg); }
.prchip .o { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.rgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
@container (max-width: 980px) { .rgrid { grid-template-columns: 1fr; } .convo { position: static !important; } }
.doc .tabs button .cnt { margin-left: 6px; font-family: var(--sans); font-size: 10.5px; padding: 0 5px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--fg); }
.doc .body { padding: 10px 0 18px; }
.blk { display: grid; grid-template-columns: 52px minmax(0, 1fr); position: relative; }
.blk .ln { font-family: var(--mono); font-size: 10.5px; color: var(--dim); text-align: right; padding: 3px 10px 0 0; opacity: .55; font-variant-numeric: tabular-nums; user-select: none; }
.blk .add { position: absolute; left: 6px; top: 2px; width: 18px; height: 18px; border-radius: 5px; border: 0; background: var(--accent); color: white; font-size: 14px; line-height: 18px; padding: 0; cursor: pointer; opacity: 0; transition: opacity .1s; }
.blk:hover .add, .blk .add:focus-visible { opacity: 1; }
.blk:hover .ln { opacity: 0; }
.blk.nocomment .add { background: var(--line); color: var(--dim); cursor: not-allowed; }
.blk.sel { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.blk.sel .ln { opacity: 1; color: var(--accent); }
.blk.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--warn) 22%, transparent); } }
@media (prefers-reduced-motion: reduce) { .blk.flash { animation: none; } }
.md { padding: 2px 22px 2px 0; min-width: 0; font-size: 13px; line-height: 1.55; max-width: 76ch; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0 0 8px; }
.md ul, .md ol { padding-left: 20px; }
.md h1 { font-size: 19px; margin: 6px 0 8px; } .md h2 { font-size: 16px; margin: 18px 0 6px; } .md h3 { font-size: 14px; margin: 14px 0 4px; } .md h4 { font-size: 13px; margin: 10px 0 4px; }
.md code { font-family: var(--mono); font-size: 11.5px; background: color-mix(in srgb, var(--fg) 8%, transparent); padding: 1px 4px; border-radius: 4px; }
.md .tw { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 12.5px; margin: 0 0 8px; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); }
.thread, .composer { margin: 6px 22px 10px 52px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); font-size: 12.5px; }
.thread.resolved { opacity: .75; }
.thread > .th { display: flex; gap: 8px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.thread.collapsed > .th { border-bottom: 0; cursor: pointer; }
.thread.collapsed .cm, .thread.collapsed .tacts { display: none; }
.thread .cm { padding: 9px 12px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 9px; }
.thread .cm + .cm { border-top: 1px solid var(--line); }
.av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: white; background: var(--info); }
.av.me { background: var(--accent); }
.cm .who { font-weight: 600; } .cm .who .dim { font-weight: 400; margin-left: 6px; font-size: 11.5px; }
.cm .tx { margin-top: 2px; overflow-wrap: anywhere; }
.tacts { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.chip.pend { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.old { color: var(--dim); background: color-mix(in srgb, var(--dim) 16%, transparent); }
.composer { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.composer .lbl { font-size: 11.5px; color: var(--dim); }
.composer textarea, .rv textarea { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; min-height: 64px; resize: vertical; width: 100%; }
.composer .row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.composer .row2 .sp { flex: 1; }
.convo { position: sticky; top: 10px; }
.convo .filters { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.convo .filters button { all: unset; cursor: pointer; padding: 3px 8px; border-radius: 6px; font-size: 11.5px; color: var(--dim); }
.convo .filters button.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--fg); font-weight: 600; }
.ci { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 12px; cursor: pointer; font-size: 12px; }
.ci:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.ci .top { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; }
.ci .top .mono { color: var(--dim); }
.ci .ex { color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ci .was { margin-top: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--dim); border-left: 2px solid var(--line); padding-left: 7px; overflow-wrap: anywhere; }
.convo .foot { padding: 10px 12px; color: var(--dim); font-size: 11.5px; }
.reviewbar { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 10px 22px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface-2) 92%, transparent); backdrop-filter: blur(8px); flex-wrap: wrap; font-size: 12.5px; }
.reviewbar .sp { flex: 1; }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.rv { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 24px 60px -20px var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.rv h2 { margin: 0; font-size: 16px; }
.rv .opt { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; align-items: start; font-size: 12.5px; }
.rv .opt input { margin: 2px 0 0; }
.rv .opt.dis { color: var(--dim); }
.rv .opt .d { grid-column: 2; color: var(--dim); font-size: 11.5px; }
.rv .acts { display: flex; gap: 8px; justify-content: flex-end; }
.rv ul { margin: 0; padding-left: 18px; color: var(--dim); font-size: 12px; }
</style>

<div class="mockbar">
  <label for="scenario">GitHub state</label>
  <select id="scenario"></select>
  <span class="hint">Mockup controls, outside the app window. Hover a paragraph in the document and click <b>+</b> to comment; shift-click another <b>+</b> to stretch the range. Threads are sample data: PR #217 has no comments on its spec files yet.</span>
</div>
<div class="win" id="win">
  <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><div class="ttl">Spec Deck — proj-nava</div></div>
  <div class="shell">
    <aside class="side">
      <div class="proj" style="padding:0 8px"><span class="ic">PN</span><b>proj-nava</b></div>
      <div><h6>Specs</h6><div class="nav">
        <button>All specs<span class="n">104</span></button>
        <button>Waiting on me<span class="n">9</span></button>
        <button>Unfinished<span class="n">14</span></button>
        <button class="on">Open review threads<span class="n" id="navcount">3</span></button>
        <button>Timeline</button>
      </div></div>
      <div><h6>Open review threads</h6><div class="nav">
        <button class="on" title="Campaign budgeting">27394 campaign budgeting<span class="n" id="navcount2">3</span></button>
      </div></div>
    </aside>
    <main class="main" id="main" style="padding-bottom:0"></main>
  </div>
  <div id="reviewbar"></div>
</div>
<div id="dialog"></div>
<div class="toast" id="toast"></div>

<script>
const D = /*__DATA__*/null;
const FILE = D.dir + "/spec.md";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ini = u => u.slice(0, 2).toUpperCase();

// ---- readiness: the three checks Alex named, plus three branch checks that decide where a comment can land
const SCEN = {
  ready:   { label: "Ready", ok: true, read: true },
  nogh:    { label: "GitHub CLI not installed", msg: `Comments need the GitHub CLI. Install it with <code>brew install gh</code>, then reopen this repo.`, read: false },
  noauth:  { label: "Not signed in", msg: `You're not signed in to GitHub. Run <code>gh auth login</code> in a terminal, then click Check again.`, read: false },
  offline: { label: "Remote not responding", msg: `Can't reach <code>github.com/${esc(D.repo)}</code>. Check your connection or VPN, then click Check again.`, read: false },
  nopr:    { label: "Branch has no PR", msg: `<code>${esc(D.branch)}</code> has no pull request. Open one with <code>gh pr create --draft</code>, then click Check again.`, read: false, nopr: true },
  ahead:   { label: "Local commits not pushed", msg: `2 local commits aren't on GitHub. Push them so comments land on the lines you see.`, read: true },
  dirty:   { label: "spec.md edited locally", msg: `<code>spec.md</code> has uncommitted changes, so its line numbers may not match GitHub. Commit and push to comment on this file.`, read: true },
};

// ---- sample threads (anchored to real lines of this spec.md)
let threads = [
  { id: 1, line: 46, state: "open", c: [
    { u: "dana-k", at: "Nov 8, 09:14", t: "This rule is still a delivery assumption, not a product decision. Can we get it confirmed before schema lock? It decides the shape of the policy table." },
    { u: D.me, at: "Nov 8, 09:40", t: "Agreed. I'll ask in WB-27394 and record the answer as a Clarifications session." } ] },
  { id: 2, line: 146, state: "open", c: [
    { u: "dana-k", at: "Nov 8, 09:22", t: "Should \"at most one live version\" be a database constraint, or is the use-case check enough? Two concurrent activations could both pass the check." } ] },
  { id: 3, line: 39, state: "resolved", by: D.me, c: [
    { u: "dana-k", at: "Nov 7, 16:05", t: "If an org admin is also the planner, can they approve their own proposal?" },
    { u: D.me, at: "Nov 7, 16:30", t: "No. Same user is same user, whatever their role. FR-014 says so explicitly now." } ] },
  { id: 4, line: 41, state: "outdated", was: "- Q: Is the budget monthly or lifetime? → A: Monthly periods within the flight.", c: [
    { u: "dana-k", at: "Nov 7, 11:48", t: "Monthly periods seem wrong for campaigns that run six weeks." } ] },
  { id: 5, line: 210, end: 210, state: "pending", c: [
    { u: D.me, at: "pending", t: "This restates the delivery assumption from Clarifications. Link to it instead, so the two can't drift apart." } ] },
];
let nextId = 6;
const st = { scen: "ready", filter: "open", sel: null, draft: "", collapsed: new Set([3]), dialog: false };

// ---- split spec.md into commentable blocks with source line ranges
const toks = marked.lexer(D.spec);
const blocks = [];
{
  let line = 1;
  const push = (tok, raw) => {
    const n = (raw.replace(/\n+$/, "").match(/\n/g) || []).length;
    const arr = [tok]; arr.links = toks.links;
    blocks.push({ start: line, end: line + n, html: marked.parser(arr), tok });
  };
  for (const tok of toks) {
    if (tok.type === "space") { line += (tok.raw.match(/\n/g) || []).length; continue; }
    if (tok.type === "list") {
      tok.items.forEach((it, i) => {
        push({ ...tok, raw: it.raw, items: [it], start: tok.ordered ? (tok.start || 1) + i : "" }, it.raw);
        line += (it.raw.match(/\n/g) || []).length;
      });
      continue;
    }
    push(tok, tok.raw);
    line += (tok.raw.match(/\n/g) || []).length;
  }
}
const blockOf = ln => blocks.findIndex(b => ln >= b.start && ln <= b.end);

function canComment() { const s = SCEN[st.scen]; return !!s.ok; }
function canRead() { return SCEN[st.scen].read; }
const pending = () => threads.filter(t => t.state === "pending");
const lines = (a, b) => a === b ? `line ${a}` : `lines ${a}–${b}`;

function comment(c) {
  const me = c.u === D.me;
  return `<div class="cm"><span class="av ${me ? "me" : ""}">${esc(ini(c.u))}</span><div><div class="who">${esc(c.u)}<span class="dim">${c.at === "pending" ? "Pending, only you can see this" : esc(c.at)}</span></div><div class="tx">${esc(c.t)}</div></div></div>`;
}
function threadHtml(t) {
  const col = st.collapsed.has(t.id);
  const chip = t.state === "resolved" ? `<span class="chip ok">Resolved by ${esc(t.by)}</span>` : t.state === "pending" ? `<span class="chip pend">Pending review</span>` : `<span class="chip calm">Open</span>`;
  const head = `<div class="th" ${col ? `data-expand="${t.id}"` : ""}>${chip}<span class="mono dim">${lines(t.line, t.end || t.line)}</span><span class="dim" style="margin-left:auto">${col ? `${t.c.length} comments · show` : plural(t.c.length, "comment")}</span></div>`;
  const off = !canComment();
  const acts = t.state === "pending"
    ? `<div class="tacts"><button class="btn sm" data-edit="${t.id}">Edit</button><button class="btn sm" data-del="${t.id}">Delete</button></div>`
    : `<div class="tacts"><button class="btn sm" data-reply="${t.id}" ${off ? "disabled" : ""}>Reply</button><button class="btn sm" data-resolve="${t.id}" ${off ? "disabled" : ""}>${t.state === "resolved" ? "Unresolve" : "Resolve"}</button><button class="btn sm" data-agent="${t.id}" title="Copies a prompt for your coding agent">Copy for agent</button><a class="btn sm" href="https://github.com/${esc(D.repo)}/pull/${D.pr.number}" target="_blank" rel="noopener">View on GitHub ↗</a>${t.state === "resolved" ? `<button class="btn sm" data-collapse="${t.id}">Collapse</button>` : ""}</div>`;
  return `<div class="thread ${t.state} ${col ? "collapsed" : ""}" id="t${t.id}">${head}${t.c.map(comment).join("")}${acts}</div>`;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function composerHtml() {
  const { a, b, reply } = st.sel;
  const label = reply ? `Reply to the thread on ${lines(a, b)}` : `Comment on <span class="mono">spec.md</span> ${lines(a, b)}${a === b ? "" : ""} · shift-click another <b>+</b> to extend`;
  return `<div class="composer"><div class="lbl">${label}</div>
    <textarea id="draft" placeholder="${reply ? "Write a reply" : "Leave a comment. Markdown works."}">${esc(st.draft)}</textarea>
    <div class="row2"><button class="btn" data-cancel>Cancel</button><span class="sp"></span>
      ${reply ? `<button class="btn primary" data-send="reply">Reply</button>` : `<button class="btn" data-send="now">Comment now</button><button class="btn primary" data-send="review">Add to review</button>`}</div></div>`;
}

function renderDoc() {
  if (!canRead()) return `<div class="none-msg" style="padding:14px 22px">Review threads aren't available. The document still renders; see the message above.</div>` + blocks.map((b, i) => blockHtml(b, i, [])).join("");
  return blocks.map((b, i) => {
    const ts = threads.filter(t => t.state !== "outdated" && blockOf(t.line) === i);
    return blockHtml(b, i, ts);
  }).join("");
}
function blockHtml(b, i, ts) {
  const s = st.sel, inSel = s && !s.reply && b.start <= s.b && b.end >= s.a;
  const off = !canComment();
  const why = off ? SCEN[st.scen].msg.replace(/<[^>]+>/g, "") : `Comment on ${lines(b.start, b.end)}`;
  let html = b.html.replace(/<table>([\s\S]*?)<\/table>/g, '<div class="tw"><table>$1</table></div>');
  const showComposer = s && !s.reply && blockOf(s.b) === i;
  const showReply = s && s.reply && ts.some(t => t.id === s.reply);
  return `<div class="blk ${inSel ? "sel" : ""} ${off ? "nocomment" : ""}" id="b${i}"><span class="ln">${b.start}</span><button class="add" data-add="${i}" aria-label="${esc(why)}" title="${esc(why)}">+</button><div class="md">${html}</div></div>`
    + ts.map(threadHtml).join("") + (showComposer || showReply ? composerHtml() : "");
}

function renderConvo() {
  if (!canRead()) return `<div class="card panel convo"><header>Conversations</header><div class="none-msg">Not loaded.</div></div>`;
  const counts = { open: 0, resolved: 0, outdated: 0, pending: 0 };
  threads.forEach(t => counts[t.state]++);
  const f = st.filter;
  const list = threads.filter(t => t.state === f).sort((a, b) => a.line - b.line);
  const lbl = { open: "Open", pending: "Pending", resolved: "Resolved", outdated: "Outdated" };
  return `<div class="card panel convo"><header>Conversations<span class="r">PR #${D.pr.number}</span></header>
    <div class="filters">${["open", "pending", "resolved", "outdated"].map(k => `<button class="${f === k ? "on" : ""}" data-filter="${k}">${lbl[k]} · ${counts[k]}</button>`).join("")}</div>
    ${list.length ? list.map(t => `<button class="ci" data-jump="${t.id}"><div class="top"><span class="av ${t.c[0].u === D.me ? "me" : ""}" style="width:18px;height:18px;font-size:9px">${esc(ini(t.c[0].u))}</span><b>${esc(t.c[0].u)}</b><span class="mono">spec.md:${t.line}</span>${t.c.length > 1 ? `<span class="dim" style="margin-left:auto">${t.c.length - 1} repl${t.c.length === 2 ? "y" : "ies"}</span>` : ""}</div><div class="ex">${esc(t.c[0].t)}</div>${t.was ? `<div class="was">The line this was on has changed. It said: ${esc(t.was)}</div>` : ""}</button>`).join("") : `<div class="none-msg">No ${lbl[f].toLowerCase()} threads.</div>`}
    <div class="foot">Threads on plan.md, tasks.md and the contracts show here too. This mockup renders spec.md only.</div></div>`;
}

function render() {
  const s = SCEN[st.scen];
  const open = threads.filter(t => t.state === "open").length;
  document.getElementById("navcount").textContent = document.getElementById("navcount2").textContent = canRead() ? open : "–";
  const pr = s.nopr ? `<span class="prchip"><span class="o" style="background:var(--dim)"></span>No PR</span>`
    : `<a class="prchip" href="https://github.com/${esc(D.repo)}/pull/${D.pr.number}" target="_blank" rel="noopener"><span class="o"></span>PR #${D.pr.number} · Open${canRead() ? ` · ${plural(open, "open thread")}` : ""}</a>`;
  const gh = s.ok
    ? `<div class="gh"><span class="lamp"></span><span class="msg">Commenting as <b>${esc(D.me)}</b> on PR #${D.pr.number}. Comments attach to commit <span class="mono">${esc(D.pr.head)}</span>, the same commit you have checked out.</span><button class="btn sm" data-check>Check again</button></div>`
    : `<div class="gh off"><span class="lamp"></span><span class="msg">${s.msg}</span><button class="btn sm" data-check>Check again</button></div>`;
  const tabs = [["spec.md", threads.filter(t => t.state === "open").length], ["plan.md", 1], ["research.md", 0], ["data-model.md", 0], ["quickstart.md", 0], ["contracts", 0], ["tasks.md", 0], ["review.md", 0]];
  document.getElementById("main").innerHTML = `
    <div class="crumbs"><button>‹ proj-nava</button><span>/</span><span class="mono">27394</span><span>/</span><span class="mono">campaign-budgeting</span></div>
    <div class="spechead"><div style="min-width:0;flex:1 1 380px">
      <h1>Campaign budgeting</h1>
      <div class="meta"><span class="pill">Analyzed</span><span class="tk">27394</span><span class="mono">⎇ ${esc(D.branch)}</span>${pr}<span>Created 2026-11-07</span></div></div>
      <div class="actions"><button class="btn">Open in editor</button><button class="btn primary">Copy /speckit-implement</button></div></div>
    ${gh}
    <div class="rgrid">
      <div class="card panel docs doc"><header>Documents<span class="r">${D.pr.specFiles} spec files in this PR · ${D.pr.files - D.pr.specFiles} code files not shown</span></header>
        <div class="tabs">${tabs.map(([n, c], i) => `<button class="${i === 0 ? "on" : ""}" data-tab="${n}">${n}${c && canRead() ? `<span class="cnt">${c}</span>` : ""}</button>`).join("")}</div>
        <div class="body">${renderDoc()}</div></div>
      ${renderConvo()}
    </div>
    <div style="height:18px"></div>`;
  const p = pending();
  document.getElementById("reviewbar").innerHTML = p.length && canRead() ? `<div class="reviewbar"><span class="chip pend">Pending review</span><span>${plural(p.length, "comment")} only you can see. Nothing is posted until you submit.</span><span class="sp"></span><button class="btn" data-discard>Discard</button><button class="btn primary" data-submit ${canComment() ? "" : "disabled"}>Submit review</button></div>` : "";
  document.getElementById("dialog").innerHTML = st.dialog ? dialogHtml() : "";
  const ta = document.getElementById("draft");
  if (ta) { ta.addEventListener("input", e => st.draft = e.target.value); ta.focus(); }
}

function dialogHtml() {
  const p = pending();
  return `<div class="scrim" data-scrim><div class="rv" role="dialog" aria-modal="true" aria-labelledby="rvh">
    <h2 id="rvh">Submit review on PR #${D.pr.number}</h2>
    <ul>${p.map(t => `<li><span class="mono">spec.md:${t.line}</span> ${esc(t.c[0].t.slice(0, 70))}${t.c[0].t.length > 70 ? "…" : ""}</li>`).join("")}</ul>
    <label for="summary" class="dim" style="font-size:12px">Summary (optional)</label>
    <textarea id="summary" placeholder="Overall thoughts on the spec"></textarea>
    <label class="opt"><input type="radio" name="ev" checked> <b>Comment</b><span class="d">Post the comments without a verdict.</span></label>
    <label class="opt dis"><input type="radio" name="ev" disabled> <b>Approve</b><span class="d">Not offered here. This PR also changes ${D.pr.files - D.pr.specFiles} code files, so approving would approve the code too. Approve on GitHub.</span></label>
    <label class="opt dis"><input type="radio" name="ev" disabled> <b>Request changes</b><span class="d">Same reason. Request changes on GitHub.</span></label>
    <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn primary" data-post>Post ${plural(p.length, "comment")}</button></div></div></div>`;
}

let tt;
function toast(h) { const el = document.getElementById("toast"); el.innerHTML = h; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2600); }
function jump(id) {
  const t = threads.find(x => x.id === id); if (!t) return;
  st.collapsed.delete(id); render();
  const el = document.getElementById("t" + id) || document.getElementById("b" + blockOf(t.line));
  el?.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  const b = document.getElementById("b" + blockOf(t.line)); b?.classList.add("flash");
}

document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-expand], [data-scrim]"); if (!el) return;
  const ds = el.dataset;
  if (ds.scrim !== undefined && e.target === el) { st.dialog = false; render(); return; }
  if (ds.add) {
    const b = blocks[+ds.add];
    if (!canComment()) { toast(SCEN[st.scen].msg); return; }
    if (e.shiftKey && st.sel && !st.sel.reply) st.sel = { a: Math.min(st.sel.a, b.start), b: Math.max(st.sel.b, b.end) };
    else st.sel = { a: b.start, b: b.end };
    render(); return;
  }
  if (ds.cancel !== undefined) { st.sel = null; st.draft = ""; render(); return; }
  if (ds.send) {
    const txt = st.draft.trim(); if (!txt) { document.getElementById("draft")?.focus(); return; }
    if (ds.send === "reply") { const t = threads.find(x => x.id === st.sel.reply); t.c.push({ u: D.me, at: "just now", t: txt }); toast(`Reply posted to PR #${D.pr.number} (mockup)`); }
    else {
      const t = { id: nextId++, line: st.sel.a, end: st.sel.b, state: ds.send === "now" ? "open" : "pending", c: [{ u: D.me, at: ds.send === "now" ? "just now" : "pending", t: txt }] };
      threads.push(t);
      toast(ds.send === "now" ? `Comment posted to PR #${D.pr.number} on ${lines(t.line, t.end)} (mockup)` : "Added to your pending review");
    }
    st.sel = null; st.draft = ""; render(); return;
  }
  if (ds.reply) { st.sel = { reply: +ds.reply, a: threads.find(x => x.id === +ds.reply).line, b: threads.find(x => x.id === +ds.reply).end || threads.find(x => x.id === +ds.reply).line }; st.draft = ""; render(); return; }
  if (ds.resolve) { const t = threads.find(x => x.id === +ds.resolve); if (t.state === "resolved") { t.state = "open"; st.collapsed.delete(t.id); } else { t.state = "resolved"; t.by = D.me; st.collapsed.add(t.id); } render(); return; }
  if (ds.expand) { st.collapsed.delete(+ds.expand); render(); return; }
  if (ds.collapse) { st.collapsed.add(+ds.collapse); render(); return; }
  if (ds.del) { threads = threads.filter(x => x.id !== +ds.del); render(); return; }
  if (ds.edit) { const t = threads.find(x => x.id === +ds.edit); threads = threads.filter(x => x !== t); st.sel = { a: t.line, b: t.end || t.line }; st.draft = t.c[0].t; render(); return; }
  if (ds.agent) {
    const t = threads.find(x => x.id === +ds.agent);
    const txt = `Review thread on ${FILE} ${lines(t.line, t.end || t.line)} (PR #${D.pr.number}):\n` + t.c.map(c => `- ${c.u}: ${c.t}`).join("\n") + `\nUpdate the spec to address it. Don't resolve the thread; a human does that.`;
    navigator.clipboard?.writeText(txt).then(() => toast("Copied a prompt for your coding agent"), () => toast("Copy blocked here; in the app this goes to the clipboard"));
    return;
  }
  if (ds.filter) { st.filter = ds.filter; render(); return; }
  if (ds.jump) { jump(+ds.jump); return; }
  if (ds.tab && ds.tab !== "spec.md") { toast(`${esc(ds.tab)} renders the same way in the app. The mockup shows spec.md.`); return; }
  if (ds.check !== undefined) { toast(SCEN[st.scen].ok ? "All checks passed" : "Still failing: " + SCEN[st.scen].label); return; }
  if (ds.discard !== undefined) { threads = threads.filter(t => t.state !== "pending"); toast("Pending review discarded"); render(); return; }
  if (ds.submit !== undefined) { st.dialog = true; render(); return; }
  if (ds.close !== undefined) { st.dialog = false; render(); return; }
  if (ds.post !== undefined) { const n = pending().length; pending().forEach(t => { t.state = "open"; t.c[0].at = "just now"; }); st.dialog = false; st.filter = "open"; toast(`Review posted to PR #${D.pr.number}: ${plural(n, "comment")} (mockup)`); render(); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (st.dialog) st.dialog = false; else st.sel = null; render(); } });

const sel = document.getElementById("scenario");
sel.innerHTML = Object.entries(SCEN).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join("");
sel.addEventListener("change", () => { st.scen = sel.value; st.sel = null; render(); });
render();
</script>
