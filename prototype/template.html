<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec Deck mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a macOS window, sidebar + content; dark-first, low-contrast layered surfaces, one violet accent,
   a single gradient reserved for the feature being worked on now, hatching for idle or off time. */
:root {
  color-scheme: dark;
  --bg: #0e0e10; --surface: #161618; --surface-2: #1c1c1f; --card: #1f1f23; --fg: #ececf0; --dim: #8d8d97; --line: #2a2a30;
  --accent: #8b7cf6; --ok: #3ecf8e; --warn: #f0b24a; --bad: #ff6767; --info: #7aa2ff; --agent: #b49cff;
  --btn-bg: #f2f2f5; --btn-fg: #111114; --hatch: rgb(255 255 255 / .05); --shadow: rgb(0 0 0 / .45);
  --grad: linear-gradient(100deg, #5d74f2 0%, #9a85f2 32%, #e99bc8 68%, #f1c48e 100%);
  --r: 12px; --r-sm: 8px;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #e9e9ee; --surface: #ffffff; --surface-2: #f5f5f8; --card: #ffffff; --fg: #1b1b20; --dim: #696974; --line: #e0e0e7;
  --accent: #6a5ae0; --ok: #1f9d55; --warn: #b26a00; --bad: #d23b3b; --info: #2f6fed; --agent: #7a4fd6;
  --btn-bg: #1b1b20; --btn-fg: #ffffff; --hatch: rgb(0 0 0 / .05); --shadow: rgb(0 0 0 / .12); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #e9e9ee; --surface: #ffffff; --surface-2: #f5f5f8; --card: #ffffff; --fg: #1b1b20; --dim: #696974; --line: #e0e0e7;
  --accent: #6a5ae0; --ok: #1f9d55; --warn: #b26a00; --bad: #d23b3b; --info: #2f6fed; --agent: #7a4fd6;
  --btn-bg: #1b1b20; --btn-fg: #ffffff; --hatch: rgb(0 0 0 / .05); --shadow: rgb(0 0 0 / .12); color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--sans); color: var(--fg); background: var(--bg); font-size: 13px; line-height: 1.4;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .toast, .car { transition: none; } }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.dim { color: var(--dim); }

/* ---------- window ---------- */
.win { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  box-shadow: 0 1px 2px var(--shadow), 0 24px 60px -20px var(--shadow); container-type: inline-size; max-width: 1360px; margin: 0 auto; }
.titlebar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: relative; }
.nav svg { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
.lights { display: flex; gap: 7px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.titlebar .ttl { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; color: var(--dim); pointer-events: none; font-size: 12.5px; }
.shell { display: grid; grid-template-columns: 212px 1fr; min-height: 760px; }


/* ---------- sidebar ---------- */
.side { border-right: 1px solid var(--line); background: var(--surface-2); padding: 12px 8px; display: flex; flex-direction: column; gap: 14px; }
.side h6 { margin: 0 8px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { all: unset; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.nav button:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.nav button.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--fg); font-weight: 600; }
.nav .n { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11.5px; font-weight: 400; }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.proj { display: flex; align-items: center; gap: 8px; }
.proj .ic { width: 18px; height: 18px; border-radius: 5px; background: var(--grad); color: white; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.side .open { all: unset; cursor: pointer; padding: 5px 8px; color: var(--dim); font-size: 12px; }

/* ---------- main ---------- */
.main { padding: 18px 22px 28px; min-width: 0; }
@container (max-width: 820px) { .shell { grid-template-columns: 1fr; min-height: 0; } .shell > .side { display: none; } .main .compact-nav { display: flex; } .main { padding: 14px; } .search { width: 100%; } .head .tools { margin-left: 0; width: 100%; } }
.compact-nav { display: none; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.compact-nav select { font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.head h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.head .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
.head .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.search { padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font: inherit; width: 200px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
.seg button { all: unset; padding: 3px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--dim); }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px var(--shadow); font-weight: 600; }

.card { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); }
.sect { margin-top: 20px; }
.sect > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sect > h2 .n { font-weight: 500; }

/* now working on */
.now { padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; cursor: pointer;
  background: var(--grad); border: 0; color: #fff; box-shadow: 0 10px 30px -14px #9a85f2; }
.now .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: rgb(255 255 255 / .85); font-weight: 700; display: flex; gap: 6px; align-items: center; }
.now .pulse { background: #fff; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.now .t { font-size: 15px; font-weight: 650; text-shadow: 0 1px 2px rgb(0 0 0 / .18); }
.now .meta { color: rgb(255 255 255 / .9); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.now .meta b { color: #fff !important; }
.now .pill { color: #fff !important; background: rgb(255 255 255 / .22) !important; }
.now .right { grid-row: span 3; text-align: right; min-width: 180px; }
.now .pct { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.now .prog .track { background: rgb(255 255 255 / .3); } .now .prog .fill, .now .prog .fill.ok { background: #fff; } .now .prog .num { color: #fff; }

/* pipeline strip */
.pipe { display: grid; grid-template-columns: repeat(7, 1fr) auto; gap: 6px; }
.pipe button { all: unset; cursor: pointer; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pipe button:hover { border-color: color-mix(in srgb, var(--fg) 25%, var(--line)); }
.pipe button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.pipe .lbl { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pipe .cnt { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.pipe .bar { height: 3px; border-radius: 2px; }
.pipe .frag { opacity: .75; }
@container (max-width: 820px) { .pipe { grid-template-columns: repeat(4, 1fr); } }

/* rows */
.list { overflow: hidden; }
.grp { padding: 8px 14px; font-size: 11.5px; font-weight: 600; color: var(--dim); background: var(--surface-2); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; cursor: default; }
.grp:first-child { border-top: 0; }
.grp.toggle { cursor: pointer; }
.grp .n { font-weight: 400; }
.grp .gp { margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 400; }
.row { position: relative; display: grid; grid-template-columns: 54px minmax(0, 1fr) 92px 150px 64px 92px 52px; gap: 12px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.row .stripe { position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; }
.row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.row .tt { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .why { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.row .age { color: var(--dim); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
@container (max-width: 980px) { .row { grid-template-columns: 54px minmax(0,1fr) 92px 130px 52px; } .row .c-rev, .row .c-dec { display: none; } }
@container (max-width: 600px) { .row { grid-template-columns: 50px minmax(0,1fr) 90px; } .row .c-prog, .row .age { display: none; } }

.tk { font-family: var(--mono); font-size: 11px; color: var(--dim); background: var(--surface-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; text-align: center; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; width: fit-content; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
.prog { display: flex; align-items: center; gap: 8px; }
.prog .track { flex: 1; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--fg) 9%, transparent); overflow: hidden; }
.prog .fill { height: 100%; border-radius: 3px; background: var(--accent); }
.prog .fill.ok { background: var(--ok); }
.prog .num { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.verdict { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; }
.v-PASS { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.v-FAIL { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
.decs { display: flex; gap: 6px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.decs span { display: inline-flex; align-items: center; gap: 3px; }
.decs i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
.empty { padding: 30px; text-align: center; color: var(--dim); }

/* kinds */
.k-human { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.k-agent { color: var(--agent); background: color-mix(in srgb, var(--agent) 14%, transparent); }
.k-flagged { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.k-unlabeled { color: var(--dim); background: color-mix(in srgb, var(--fg) 8%, transparent); }
.s-HIGH, .s-CRITICAL { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
.s-MEDIUM { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.s-LOW, .s-INFO { color: var(--dim); background: color-mix(in srgb, var(--fg) 8%, transparent); }
.why .chip { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.calm, .why .chip.calm { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); }
.pill.from-status { outline: 1px dashed currentColor; outline-offset: -1px; }
.phase.deferred .pt { color: var(--dim); }
.passes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
.passes select { font: inherit; font-size: 12px; max-width: 100%; min-width: 0; flex: 1 1 200px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); font-size: 12px; margin-left: auto; }
.finding.resolved { opacity: .6; }
.why .chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }

/* ---------- spec view ---------- */
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-bottom: 10px; }
.crumbs button { all: unset; cursor: pointer; color: var(--accent); }
.spechead { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.spechead h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
.spechead .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; align-items: center; }
.actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.btn { all: unset; cursor: pointer; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; background: var(--card); white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--fg) 25%, var(--line)); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: transparent; font-weight: 600; }
.statusnote { margin-top: 10px; font-size: 12px; color: var(--dim); padding: 7px 10px; border-left: 2px solid var(--line); background: var(--surface-2); border-radius: 0 6px 6px 0; }
.statusnote b { color: var(--fg); font-weight: 600; }

.stepper { display: flex; margin: 16px 0 4px; }
.step { flex: 1; position: relative; text-align: center; font-size: 11px; color: var(--dim); padding-top: 18px; }
.step::before { content: ""; position: absolute; top: 5px; left: 50%; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); z-index: 1; }
.step::after { content: ""; position: absolute; top: 10px; left: -50%; width: 100%; height: 2px; background: var(--line); }
.step:first-child::after { display: none; }
.step.done { color: var(--fg); } .step.done::before { background: var(--ok); border-color: var(--ok); } .step.done::after { background: var(--ok); }
.step.cur { color: var(--accent); font-weight: 700; } .step.cur::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); } .step.cur::after { background: var(--ok); }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.kpi { padding: 10px 12px; }
.kpi .l { font-size: 11px; color: var(--dim); }
.kpi .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; margin-top: 2px; }
.kpi .s { font-size: 11.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@container (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; margin-top: 18px; align-items: start; }
@container (max-width: 980px) { .grid2 { grid-template-columns: 1fr; } }
.panel > header { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel > header .r { margin-left: auto; color: var(--dim); font-weight: 400; font-size: 12px; }
.nextbox { margin: 10px 14px 4px; padding: 9px 11px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 9%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: 12.5px; }
.nextbox b { color: var(--accent); }
.phase { border-top: 1px solid var(--line); }
.phase:first-of-type { border-top: 0; }
.phase > .ph { display: grid; grid-template-columns: 14px minmax(0,1fr) 150px; gap: 10px; align-items: center; padding: 9px 14px; cursor: pointer; }
.phase > .ph:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.phase .car { color: var(--dim); font-size: 10px; transition: transform .15s; }
.phase.open .car { transform: rotate(90deg); }
.phase .pt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phase .pt .ix { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 6px; }
.tasks { display: none; padding: 0 14px 10px 38px; }
.phase.open .tasks { display: block; }
.task { display: grid; grid-template-columns: 16px 46px auto minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 3px 0; font-size: 12.5px; }
.task .cb { width: 13px; height: 13px; border-radius: 3.5px; border: 1.5px solid var(--dim); display: grid; place-items: center; position: relative; top: 2px; }
.task.done .cb { background: var(--ok); border-color: var(--ok); }
.task.done .cb::after { content: ""; width: 3px; height: 6px; border: solid white; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg) translate(-.5px, -.5px); }
.task.done .tx { color: var(--dim); }
.task.next { background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: 5px; margin: 0 -6px; padding: 3px 6px; }
.task .tags { display: flex; gap: 3px; }
.tag { font-size: 10px; font-family: var(--mono); padding: 0 4px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); color: var(--dim); }
.tag.p { color: var(--info); border-color: color-mix(in srgb, var(--info) 35%, var(--line)); }
.trimmed { padding: 4px 0 2px; color: var(--dim); font-size: 12px; font-style: italic; }

.story { display: grid; grid-template-columns: 30px minmax(0, 1fr) 118px; gap: 10px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 12.5px; }
.story:first-of-type { border-top: 0; }
.story .pr { font-size: 10.5px; font-weight: 700; color: var(--dim); }
.story .pr.P1 { color: var(--accent); }
.story .st { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.story .none { font-size: 11.5px; color: var(--dim); text-align: right; font-style: italic; }

.finding { padding: 9px 14px; border-top: 1px solid var(--line); font-size: 12.5px; }
.finding:first-of-type { border-top: 0; }
.finding .fh { display: flex; gap: 8px; align-items: center; margin-bottom: 3px; }
.finding .fix { color: var(--dim); font-size: 12px; margin-top: 3px; }
.finding > div:nth-child(2) { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.finding .fix { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.panel .none-msg { padding: 14px; color: var(--dim); font-size: 12.5px; }

.dfilters { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dfilters button { all: unset; cursor: pointer; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); }
.dfilters button.on { border-color: var(--fg); font-weight: 600; }
.session { border-top: 1px solid var(--line); }
.session:first-of-type { border-top: 0; }
.session > .sh { display: grid; grid-template-columns: 14px auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; cursor: pointer; }
.session > .sh:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.session .car { color: var(--dim); font-size: 10px; transition: transform .15s; }
.session.open .car { transform: rotate(90deg); }
.session .sl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qa { display: none; padding: 0 14px 10px 38px; }
.session.open .qa { display: block; }
.qa > div { padding: 6px 0; border-top: 1px dashed var(--line); font-size: 12.5px; }
.qa > div:first-child { border-top: 0; }
.qa .q { font-weight: 550; }
.qa .a { color: var(--dim); margin-top: 2px; }
.qa .a::before { content: "→ "; color: var(--accent); }

.docs .tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.docs .tabs button { all: unset; cursor: pointer; padding: 6px 10px; font-size: 12px; font-family: var(--mono); color: var(--dim); border-bottom: 2px solid transparent; white-space: nowrap; }
.docs .tabs button.on { color: var(--fg); border-color: var(--accent); }
.docs .body { padding: 16px 18px; min-height: 120px; }

<script>/*__RVMOCK__*/</script>
<script>
const DATA = /*__DATA__*/null;
const STAGES = DATA.stages; // Specified … Done
const STAGE_COLOR = {
  Specified: "color-mix(in srgb, var(--dim) 70%, var(--accent))",
  Clarified: "color-mix(in srgb, var(--dim) 45%, var(--accent))",
  Planned: "color-mix(in srgb, var(--dim) 25%, var(--accent))",
  Tasked: "var(--accent)",
  Analyzed: "var(--agent)",
  Building: "var(--warn)",
  Done: "var(--ok)",
  Fragment: "var(--dim)",
};
const NEXT_CMD = { Specified: "/speckit-clarify", Clarified: "/speckit-plan", Planned: "/speckit-tasks",
  Tasked: "/speckit-analyze", Analyzed: "/speckit-implement", Building: "/speckit-implement" };
const KIND_LABEL = { human: "Human", agent: "Agent", flagged: "Flagged", unlabeled: "Unattributed" };
const DOC_ORDER = ["spec.md", "plan.md", "research.md", "data-model.md", "quickstart.md", "contracts", "tasks.md", "checklists", "review.md", "deployment.md"];

const F = DATA.features;
const byId = Object.fromEntries(F.map(f => [f.id, f]));
const NOW = new Date(DATA.generated);

const state = { view: "project", spec: null, nav: "all", stage: null, q: "", group: "stage", showDone: false, docTab: "spec.md", dkind: "all", open: new Set(), pass: {},
  zoom: "month", tlRange: "flight", tlGroup: "ticket", tlCollapsed: new Set(), tlSel: null, tlCenter: true, modal: null };

// ---------- derived ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tot = f => f.phases.reduce((a, p) => [a[0] + p.done, a[1] + p.total], [0, 0]);
const dec = f => { const c = { human: 0, agent: 0, flagged: 0, unlabeled: 0 }; f.sessions.forEach(s => c[s.kind] += s.n); return c; };
const days = iso => iso ? Math.round((NOW - new Date(iso)) / 864e5) : null;
const ago = iso => { const d = days(iso); if (d == null) return "—"; if (d < 1) return "today"; if (d < 30) return d + "d"; if (d < 365) return Math.round(d / 30) + "mo"; return Math.round(d / 365) + "y"; };
const latest = f => f.review?.passes.at(-1) || null;
const inFlight = f => f.stage !== "Done" && f.stage !== "Fragment";
const plural = (n, w) => n + " " + w + (n === 1 ? "" : /s$/.test(w) ? "es" : "s");
// "Waiting on me": only a human can unblock it. Chips: [label, tone] where tone 1 = critical.
function waiting(f) {
  const r = [], lp = latest(f);
  if (f.markers.length) r.push([plural(f.markers.length, "open question"), 1]);
  if (lp?.verdict === "FAIL") r.push([(lp.gate || "Review") + " FAIL", 1]);
  const hi = (lp?.findings || []).filter(x => !x.resolved && (x.severity === "HIGH" || x.severity === "CRITICAL")).length;
  if (hi) r.push([plural(hi, "open HIGH finding"), 1]);
  const fl = dec(f).flagged; if (inFlight(f) && fl) r.push([plural(fl, "flagged conflict"), 0]);
  return r;
}
// "Unfinished": not fully planned, or partially built.
function remaining(f) {
  const open = f.phases.filter(p => p.done < p.total);
  return { live: open.filter(p => !p.deferred).length, deferred: open.filter(p => p.deferred).length };
}
function unfinished(f) {
  if (!inFlight(f)) return [];
  if (f.stage === "Specified" || f.stage === "Clarified") return [["Not planned", 0]];
  if (f.stage === "Planned") return [["Planned, no tasks", 0]];
  if (f.stage === "Tasked" || f.stage === "Analyzed") return [["Not started", 0]];
  const r = [], rem = remaining(f), d = days(f.lastCommit);
  if (!rem.live && rem.deferred) r.push(["Rest deferred", 2]);
  else if (d != null && d > 14) r.push(["Stalled " + d + "d", 0]);
  return r;
}
const waitingList = F.filter(f => waiting(f).length);
const unfinishedList = F.filter(f => unfinished(f).length || f.stage === "Building");
const agentHeavy = F.filter(f => f.stage !== "Done" && dec(f).agent + dec(f).flagged > 0);
const NAVS = [["all", "All specs"], ["timeline", "Timeline"], ["waiting", "Waiting on me"], ["unfinished", "Unfinished"], ["agent", "Agent decisions"], ["review", "Open review threads"]];
const LISTS = { all: F, timeline: F.filter(inFlight), waiting: waitingList, unfinished: unfinishedList, agent: agentHeavy, review: [] };
const ICONS = {
  all: '<rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/>',
  timeline: '<path d="M2 4h7M5 8h9M3 12h6"/>',
  waiting: '<circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h.01"/>',
  unfinished: '<circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor" stroke="none"/>',
  agent: '<path d="M8 2l1.4 4.6L14 8l-4.6 1.4L8 14l-1.4-4.6L2 8l4.6-1.4z"/>',
  review: '<path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/>',
};
const icon = k => `<svg viewBox="0 0 16 16" aria-hidden="true">${ICONS[k]}</svg>`;
const stageCount = s => F.filter(f => f.stage === s).length;
const cur = DATA.current && byId[DATA.current.feature];

// ---------- review threads on GitHub (User Story 10; the layer lives in review-layer.js) ----------
// @rv-backend-start
const RV_SAMPLE = (DATA.current && byId[DATA.current.feature]) || F.find(f => f.stage === "Building") || F[0];
const RV = createReview({
  backend: createMockBackend({ esc, me: "you", repo: "your-org/" + DATA.project, branch: RV_SAMPLE.branch || "feature/sample", feature: RV_SAMPLE.id,
    pr: { number: 217, head: "7166855", changedFiles: 121, specFiles: 12 }, files: RV_SAMPLE.files.filter(x => /\.md$/.test(x)),
    threads: sampleThreads("you").map(t => ({ ...t, path: "spec.md" })), scenario: () => "ready" }),
  esc, toast, rerender: () => render(), openTab: tab => { state.docTab = tab; render(); },
  copy: text => navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject("Copy is blocked here."),
  openUrl: url => window.open(url, "_blank", "noopener"),
});
// @rv-backend-end

// ---------- small renderers ----------
const pill = (s, src) => `<span class="pill ${src === "status" ? "from-status" : ""}" ${src === "status" ? 'title="Stage taken from the spec Status line (no tasks.md)"' : ""} style="color:${STAGE_COLOR[s]};background:color-mix(in srgb, ${STAGE_COLOR[s]} 14%, transparent)">${s}${src === "status" ? "*" : ""}</span>`;
function prog(done, total, wide) {
  if (!total) return `<span class="dim" style="font-size:11.5px">no tasks</span>`;
  const p = Math.round(done / total * 100);
  return `<div class="prog"><div class="track"><div class="fill ${done === total ? "ok" : ""}" style="width:${p}%"></div></div><span class="num">${done}/${total}</span></div>`;
}
const verdict = r => r?.verdict ? `<span class="verdict v-${r.verdict}">${r.verdict}</span>` : `<span class="dim" style="font-size:11.5px">—</span>`;
function decs(f) {
  const c = dec(f), parts = [];
  if (c.agent) parts.push(`<span title="Agent decisions"><i style="background:var(--agent)"></i>${c.agent}</span>`);
  if (c.flagged) parts.push(`<span title="Flagged conflicts"><i style="background:var(--warn)"></i>${c.flagged}</span>`);
  if (c.human) parts.push(`<span title="Human decisions"><i style="background:var(--ok)"></i>${c.human}</span>`);
  return `<div class="decs">${parts.join("") || '<span class="dim">—</span>'}</div>`;
}
function row(f) {
  const [d, t] = tot(f);
  // Building-state chips (stalled / deferred) always show; planning chips only in the Unfinished view.
  const why = waiting(f).concat(unfinished(f).filter(([, tone]) => state.nav === "unfinished" || f.stage === "Building"));
  const tone = n => n === 1 ? "bad" : n === 2 ? "calm" : "";
  return `<div class="row" data-open="${esc(f.id)}"><i class="stripe" style="background:${STAGE_COLOR[f.stage]}"></i>
    <span class="tk">${esc(f.ticket)}</span>
    <div style="min-width:0"><div class="tt" title="${esc(f.title)}">${esc(f.title)}</div>
      ${why.length ? `<div class="why">${why.map(([w, b]) => `<span class="chip ${tone(b)}">${esc(w)}</span>`).join("")}</div>` : `<div class="dim mono" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.slug)}</div>`}</div>
    <div>${pill(f.stage, f.stageSource)}</div>
    <div class="c-prog">${prog(d, t)}</div>
    <div class="c-rev">${verdict(f.review)}</div>
    <div class="c-dec">${decs(f)}</div>
    <div class="age" title="${esc(f.lastCommit || "")}">${ago(f.lastCommit)}</div>
  </div>`;
}

// ---------- sidebar ----------
function renderSide() {
  LISTS.review = F.filter(f => RV.counts()[f.id] > 0);
  const navs = NAVS.map(([k, l]) => [k, l, LISTS[k].length]);
  const stageBtn = s => `<button class="${state.stage === s && state.view === "project" ? "on" : ""}" data-stage="${s}"><span class="dot" style="background:${STAGE_COLOR[s]}"></span>${s}<span class="n">${stageCount(s)}</span></button>`;
  document.getElementById("side").innerHTML = `
    <div><h6>Projects</h6><div class="nav">
      <button class="on"><span class="proj"><span class="ic">N</span>${esc(DATA.project)}</span><span class="n">${F.length}</span></button>
      ${recents.filter(r => r.ok && !isOpen(r)).map(r => `<button data-recent="${esc(r.path)}" title="${esc(shown(r))}"><span class="proj"><span class="ic" style="background:var(--surface-2);color:var(--dim)">${esc(r.name[0].toUpperCase())}</span>${esc(r.name)}</span><span class="n">${r.specs}</span></button>`).join("")}
    </div><button class="open">+ Open project…</button></div>
    <div><h6>Views</h6><div class="nav">${navs.map(([k, l, n]) => `<button class="${state.nav === k && !state.stage && state.view === "project" ? "on" : ""}" data-nav="${k}">${icon(k)}${l}<span class="n">${k === "timeline" ? "" : n}</span></button>`).join("")}</div></div>
    <div><h6>Stages</h6><div class="nav">${[...STAGES].map(stageBtn).join("")}${stageBtn("Fragment")}</div></div>
    ${cur ? `<div><h6>Now working on</h6><div class="nav"><button data-open="${esc(cur.id)}" class="${state.spec === cur.id && state.view === "spec" ? "on" : ""}"><span class="pulse"></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(cur.ticket)} ${esc(cur.slug)}</span></button></div></div>` : ""}
  `;
}
function compactNav() {
  return `<div class="compact-nav">
    <select data-cnav aria-label="View">${NAVS.map(([k, l]) => `<option value="nav:${k}" ${state.nav === k && !state.stage ? "selected" : ""}>${l}</option>`).join("")}
      ${[...STAGES, "Fragment"].map(s => `<option value="stage:${s}" ${state.stage === s ? "selected" : ""}>Stage: ${s}</option>`).join("")}</select>
  </div>`;
}

// ---------- project view ----------
function renderProject() {
  if (state.nav === "timeline" && !state.stage) return renderTimeline();
  const q = state.q.trim().toLowerCase();
  let list = LISTS[state.nav];
  if (state.stage) list = list.filter(f => f.stage === state.stage);
  if (q) list = list.filter(f => (f.title + " " + f.id + " " + (f.branch || "")).toLowerCase().includes(q));
  const title = state.stage ? state.stage : Object.fromEntries(NAVS)[state.nav];

  let body = "";
  if (!list.length) body = `<div class="empty">No specs match.</div>`;
  else if (state.group === "ticket") {
    const groups = {};
    list.forEach(f => (groups[f.ticket] ??= []).push(f));
    Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0], undefined, { numeric: true })).forEach(([tk, fs]) => {
      const [d, t] = fs.reduce((a, f) => { const [x, y] = tot(f); return [a[0] + x, a[1] + y]; }, [0, 0]);
      body += `<div class="grp"><span class="mono">${esc(tk)}</span><span class="n">${fs.length} spec${fs.length > 1 ? "s" : ""}</span>${fs.length > 1 ? `<span class="gp" style="width:170px">${prog(d, t)}</span>` : ""}</div>` + fs.map(row).join("");
    });
  } else {
    const order = [...STAGES].reverse().filter(s => s !== "Done").concat(["Done", "Fragment"]);
    order.forEach(s => {
      const fs = list.filter(f => f.stage === s).sort((a, b) => (b.lastCommit || "").localeCompare(a.lastCommit || ""));
      if (!fs.length) return;
      const collapsible = s === "Done" && !state.stage && fs.length > 5;
      const open = !collapsible || state.showDone;
      body += `<div class="grp ${collapsible ? "toggle" : ""}" ${collapsible ? 'data-toggle-done' : ""}><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${STAGE_COLOR[s]}"></span>${s}<span class="n">${fs.length}</span>${collapsible ? `<span class="gp">${open ? "Hide" : "Show"} ▾</span>` : ""}</div>` + (open ? fs.map(row).join("") : "");

  }

  const nowCard = cur && state.nav === "all" && !state.stage && !q ? (() => {
    const [d, t] = tot(cur);
    return `<div class="card now" data-open="${esc(cur.id)}">
      <div class="eyebrow"><span class="pulse"></span>Now working on · from .specify/feature.json</div>
      <div class="right"><div class="pct">${t ? Math.round(d / t * 100) : 0}%</div><div style="margin-top:4px">${prog(d, t)}</div></div>
      <div class="t">${esc(cur.title)}</div>
      <div class="meta">${pill(cur.stage)}<span class="mono">${esc(DATA.current.branch || cur.branch || "")}</span>${cur.next ? `<span>Next: <b class="mono" style="color:var(--fg)">${esc(cur.next[0])}</b> ${esc(cur.next[1])}</span>` : ""}</div>
    </div>`;
  })() : "";

  const pipe = state.nav === "all" && !q ? `<div class="sect"><div class="pipe">${STAGES.map(s => {
      const n = stageCount(s), mx = Math.max(...STAGES.map(stageCount));
      return `<button class="${state.stage === s ? "on" : ""}" data-stage="${s}"><span class="lbl">${s}</span><span class="cnt">${n}</span><span class="bar" style="background:${STAGE_COLOR[s]};width:${Math.max(n ? 8 : 0, n / mx * 100)}%"></span></button>`;
    }).join("")}<button class="frag ${state.stage === "Fragment" ? "on" : ""}" data-stage="Fragment" title="Folders without spec.md"><span class="lbl">Fragments</span><span class="cnt">${stageCount("Fragment")}</span><span class="bar" style="background:var(--dim);width:30%"></span></button></div></div>` : "";

  document.getElementById("main").innerHTML = `
    ${compactNav()}
    <div class="head"><div><h1>${esc(title)}</h1><div class="sub">${esc(DATA.project)} · ${F.length} features · on <span class="mono">${esc(DATA.head)}</span> · parsed ${new Date(DATA.generated).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</div></div>
      <div class="tools"><input class="search" id="q" placeholder="Filter by title, ticket, branch" value="${esc(state.q)}">
      <div class="seg"><button class="${state.group === "stage" ? "on" : ""}" data-group="stage">Stage</button><button class="${state.group === "ticket" ? "on" : ""}" data-group="ticket">Ticket</button></div></div></div>
    ${nowCard}
    ${pipe}
    ${state.nav === "waiting" ? `<div class="legend">Only you can unblock these: open questions, a FAIL in the latest review pass, or open HIGH/CRITICAL findings in that pass (Done specs included), or flagged conflicts on in-flight specs.</div>` : ""}
    ${state.nav === "unfinished" ? `<div class="legend">Not fully planned (no tasks yet) or partially built. "Stalled" means no commit in 14 days; "Rest deferred" means every open task sits in a phase marked Deferred.</div>` : ""}
    ${state.nav === "all" && !state.stage && !q ? `<div class="legend">* Stage taken from the spec's Status line because the folder has no tasks.md.</div>` : ""}

  const qi = document.getElementById("q");
  qi.addEventListener("input", e => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
}

// ---------- timeline ----------
const DAY = 864e5;
const TODAY = new Date(Date.UTC(NOW.getUTCFullYear(), NOW.getUTCMonth(), NOW.getUTCDate()));
const utcDay = iso => { const d = new Date(iso); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); };

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function spanOf(f) {
  const c = /^\d{4}-\d{2}-\d{2}/.test(f.created || "") ? f.created.slice(0, 10) : f.firstCommit;
  if (!c) return null;
  const start = utcDay(c + "T00:00:00Z");
  const last = f.lastCommit ? utcDay(f.lastCommit) : start;
  const end = inFlight(f) ? TODAY : last;
  return { start, last: last < start ? start : last, end: end < start ? start : end };

const fmtDate = d => `${MONTHS[d.getUTCMonth()].slice(0, 3)} ${d.getUTCDate()}`;
// Dated events in a spec's life: created, clarification sessions, review passes, merge or last commit.
function milestones(f, s) {
  const ev = [{ d: s.start, kind: "created", label: "Created" }];
  f.sessions.forEach(se => se.date && ev.push({ d: utcDay(se.date + "T00:00:00Z"), kind: "s-" + se.kind, label: `Clarified (${KIND_LABEL[se.kind].toLowerCase()}${se.n ? ", " + plural(se.n, "question") : ""})` }));
  (f.review?.passes || []).forEach(p => p.date && ev.push({ d: utcDay(p.date + "T00:00:00Z"), kind: (p.gate === "Review" ? "rv-" : "an-") + (p.verdict || "none"), label: `${p.gate || "Review"} ${p.verdict || "(no verdict)"}` }));

  const leads = F.filter(f => f.stage === "Done").map(f => ({ f, s: spanOf(f) })).filter(x => x.s && (TODAY - x.s.last) / DAY <= 90).map(x => Math.round((x.s.last - x.s.start) / DAY) + 1);

// Redraws replace the page's HTML, and WebKit then drops the scroll position. Keep it (and the

function storyTasks(f, n) { return allTasks(f).filter(x => x.t[3] === "US" + n); }
function findingRow(x) {
  return `<div class="mfind ${x.resolved ? "resolved" : ""}"><div class="fh"><span class="chip s-${x.severity}">${x.severity}</span><span class="mono">${esc(x.id)}</span>
    <span class="dim">${esc(x.pass.gate || "Review")}${x.pass.date ? " · " + esc(x.pass.date) : ""}${x.latest ? " · latest pass" : " · earlier pass"}</span>${x.status ? `<span class="dim" style="margin-left:auto">${esc(x.status)}</span>` : ""}</div>
    <div>${esc(x.text)}</div></div>`;
}
function modalHeader(i, n, what) {
  return `<header class="dh"><div class="dnav"><button class="iconbtn" data-mnav="-1" ${i <= 0 ? "disabled" : ""} aria-label="Previous ${what}">‹</button>
    <span class="dim">${i + 1} of ${n}</span><button class="iconbtn" data-mnav="1" ${i >= n - 1 ? "disabled" : ""} aria-label="Next ${what}">›</button></div>
    <button class="iconbtn" data-close aria-label="Close">✕</button></header>`;
}
function taskModal(f, id) {
  const all = allTasks(f), i = all.findIndex(x => x.t[0] === id);
  if (i < 0) return null;
  const { p, pi, t } = all[i], [tid, dn, par, st, tx, raw, files, tags] = t;
  const isNext = f.next?.[0] === tid;
  const story = st && f.stories.find(x => "US" + x[0] === st);
  const sTasks = story ? storyTasks(f, story[0]) : [];
  const finds = findingsFor(f, x => (x.tasks || []).includes(tid));
  const status = dn ? `<span class="st st-done">Done</span>` : isNext ? `<span class="st st-next">Next up</span>` : `<span class="st st-open">Open</span>`;
  return `${modalHeader(i, all.length, "task")}
  <div class="db">
    <div class="eyebrow2"><span class="mono">${esc(f.ticket)}</span> · ${esc(f.title)} · Phase ${pi + 1}: ${esc(p.title)}</div>
    <h2 id="dlg-title"><span class="mono tid">${tid}</span>${status}</h2>
    <div class="chips">${par ? `<span class="chip calm">Parallel-safe [P]</span>` : ""}${st ? `<button class="linkchip k-unlabeled" data-story="${esc(st.slice(2))}">${esc(st)}</button>` : ""}${(tags || []).map(x => `<span class="chip k-unlabeled">${esc(x)}</span>`).join("")}${p.deferred ? `<span class="chip calm">Deferred phase</span>` : ""}</div>
    <p class="lead">${mdInline(raw || tx, `specs/${esc(f.id)}/`)}</p>
    ${files?.length ? `<section><h3>Files<span class="dim">${files.length}</span></h3><ul class="files">${files.map(x => `<li><span class="mono">${esc(x)}</span><button class="btn sm" data-openpath="${esc(x)}">Open</button></li>`).join("")}</ul></section>` : ""}
    ${story ? `<section><h3>User story</h3><button class="storycard" data-story="${story[0]}"><span class="pr ${story[2]}">${story[2]}</span><span><span class="dim">US${story[0]}</span> ${esc(story[1])}</span>${prog(sTasks.filter(x => x.t[1]).length, sTasks.length)}</button></section>` : ""}
    <section><h3>Mentioned in review<span class="dim">${finds.length}</span></h3>${finds.length ? finds.map(findingRow).join("") : `<p class="dim" style="margin:0">No review finding mentions ${tid}.</p>`}</section>
  </div>
  <footer class="df"><span class="hint"><kbd>←</kbd> <kbd>→</kbd> step through tasks · <kbd>Esc</kbd> close</span>
    <button class="btn" data-copy="specs/${esc(f.id)}/tasks.md ${tid}">Copy reference</button><button class="btn" data-openpath="specs/${esc(f.id)}/tasks.md">Open tasks.md</button></footer>`;
}
function storyModal(f, n) {
  const i = f.stories.findIndex(x => x[0] === n);
  if (i < 0) return null;
  const [sn, title, pr, body] = f.stories[i];
  const ts = storyTasks(f, sn), done = ts.filter(x => x.t[1]).length;
  const finds = findingsFor(f, x => (x.stories || []).includes("US" + sn));
  const byPhase = new Map();
  ts.forEach(x => { if (!byPhase.has(x.pi)) byPhase.set(x.pi, []); byPhase.get(x.pi).push(x); });
  const scen = (body?.scenarios || []).map(x => mdInline(x, `specs/${esc(f.id)}/`).replace(/,?\s*(<b class="gwt gwt-(when|then|and)">)/g, "<br>$1"));
  return `${modalHeader(i, f.stories.length, "story")}
  <div class="db">
    <div class="eyebrow2"><span class="mono">${esc(f.ticket)}</span> · ${esc(f.title)}</div>
    <h2 id="dlg-title"><span class="chip ${pr === "P1" ? "calm" : "k-unlabeled"}">${esc(pr)}</span><span><span class="dim">US${sn}</span> ${esc(title)}</span></h2>
    <div class="sprog">${prog(done, ts.length)}<span class="dim" style="font-size:12px">${ts.length ? "tasks tagged [US" + sn + "]" : ""}</span></div>
    ${body?.description ? `<p class="lead">${mdInline(body.description, `specs/${esc(f.id)}/`)}</p>` : ""}
    ${body?.why || body?.test ? `<div class="callouts">${body.why ? `<div class="callout"><h4>Why this priority</h4><p>${mdInline(body.why, `specs/${esc(f.id)}/`)}</p></div>` : ""}${body.test ? `<div class="callout"><h4>Independent test</h4><p>${mdInline(body.test, `specs/${esc(f.id)}/`)}</p></div>` : ""}</div>` : ""}
    ${scen.length ? `<section><h3>Acceptance scenarios<span class="dim">${scen.length}</span></h3><ol class="scen">${scen.map(x => `<li>${x}</li>`).join("")}</ol></section>` : ""}
    <section><h3>Tasks<span class="dim">${done}/${ts.length}</span></h3>${ts.length ? `<div class="mtasks">${[...byPhase.entries()].map(([pi, xs]) => `<div class="ph2">Phase ${pi + 1}: ${esc(f.phases[pi].title)}</div>` + xs.map(({ t }) => `<div class="mtask ${t[1] ? "done" : ""} ${f.next?.[0] === t[0] ? "next" : ""}" data-task="${esc(t[0])}"><span class="cb"></span><span class="mono dim">${esc(t[0])}</span><span class="tx">${esc(t[4])}</span></div>`).join("")).join("")}</div>` : `<p class="dim" style="margin:0">No tasks are tagged [US${sn}].</p>`}</section>
    <section><h3>Mentioned in review<span class="dim">${finds.length}</span></h3>${finds.length ? finds.map(findingRow).join("") : `<p class="dim" style="margin:0">No review finding mentions US${sn}.</p>`}</section>
  </div>
  <footer class="df"><span class="hint"><kbd>←</kbd> <kbd>→</kbd> step through stories · <kbd>Esc</kbd> close</span>
    <button class="btn" data-copy="specs/${esc(f.id)}/spec.md US${sn}">Copy reference</button><button class="btn" data-openpath="specs/${esc(f.id)}/spec.md">Open spec.md</button></footer>`;
}
// Opens a repo-relative path with the system's default app (the app build replaces this).
function openPath(p) { toast(`Opens <code>${esc(p)}</code> in your editor (mockup)`); }

function renderModal() {
  const host = document.getElementById("modal"), m = state.modal, f = m && byId[m.spec];
  const html = f && (m.type === "task" ? taskModal(f, m.key) : storyModal(f, +m.key));
  if (!html) { host.hidden = true; host.innerHTML = ""; state.modal = null; return; }
  const scroll = host.querySelector(".db")?.scrollTop, same = host.dataset.key === `${m.spec}|${m.type}|${m.key}`;
  host.hidden = false;
  host.dataset.key = `${m.spec}|${m.type}|${m.key}`;
  host.innerHTML = `<div class="backdrop" data-close></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">${html}</div>`;
  if (same && scroll) host.querySelector(".db").scrollTop = scroll;
  if (!same) host.querySelector("[data-close].iconbtn")?.focus();
}
function stepModal(dir) {
  const m = state.modal, f = m && byId[m.spec];
  if (!f) return;
  if (m.type === "task") { const all = allTasks(f), i = all.findIndex(x => x.t[0] === m.key), n = all[i + dir]; if (n) m.key = n.t[0]; }
  else { const i = f.stories.findIndex(x => x[0] === +m.key), n = f.stories[i + dir]; if (n) m.key = n[0]; }
  renderModal();
}

// ---------- spec view ----------
function renderSpec() {
  const f = byId[state.spec];
  const [d, t] = tot(f), c = dec(f);
  const si = STAGES.indexOf(f.stage);
  const stepper = f.stage === "Fragment" ? "" : `<div class="stepper">${STAGES.map((s, i) => `<div class="step ${i < si || f.stage === "Done" ? "done" : i === si ? "cur" : ""}">${s}</div>`).join("")}</div>`;
  const nextCmd = NEXT_CMD[f.stage];

  // stories x tasks
  const sp = {};
  f.phases.forEach(p => Object.entries(p.byStory).forEach(([k, [x, y]]) => { sp[k] ??= [0, 0]; sp[k][0] += x; sp[k][1] += y; }));
  const stories = f.stories.length ? f.stories.map(([n, ti, pr]) => {
    const s = sp["US" + n];
    return `<div class="story" data-story="${n}"><span class="pr ${pr}">${pr}</span><span class="st" title="${esc(ti)}"><span class="dim">US${n}</span> ${esc(ti)}</span>${s ? prog(s[0], s[1]) : `<span class="none">no tasks</span>`}</div>`;
  }).join("") : `<div class="none-msg">No user stories in the stock heading format.</div>`;

  const phases = f.phases.length ? f.phases.map((p, i) => {
    const key = f.id + "#p" + i;
    const auto = !state.open.has(key + "!") && p.done < p.total && f.phases.findIndex(x => x.done < x.total) === i;
    const open = state.open.has(key) || auto;
    const tasks = p.tasks ? p.tasks.map(([id, dn, par, st, tx]) => `<div class="task ${dn ? "done" : ""} ${f.next && f.next[0] === id ? "next" : ""}" data-task="${esc(id)}"><span class="cb"></span><span class="mono dim">${id}</span><span class="tags">${par ? '<span class="tag p">P</span>' : ""}${st ? `<span class="tag">${st}</span>` : ""}</span><span class="tx">${esc(tx)}</span></div>`).join("") : `<div class="trimmed">Task text trimmed for finished specs in this mockup.</div>`;
    return `<div class="phase ${open ? "open" : ""} ${p.deferred ? "deferred" : ""}"><div class="ph" data-phase="${esc(key)}" data-auto="${auto ? 1 : 0}"><span class="car">▶</span><span class="pt"><span class="ix">${i + 1}</span>${p.deferred ? '<span class="chip calm" style="margin-right:6px">Deferred</span>' : ""}${esc(p.title.replace(/^Deferred\s*[—–:-]\s*/i, ""))}</span>${prog(p.done, p.total)}</div><div class="tasks">${tasks}</div></div>`;
  }).join("") : `<div class="none-msg">No tasks.md${f.stage === "Planned" ? " yet. Next step: <span class=\"mono\">/speckit-tasks</span>" : ""}.</div>`;

  const sev = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "INFO"];
  // Review: latest pass by default; earlier passes selectable. Resolved findings hidden unless asked.
  const passes = f.review?.passes || [];
  const pi = Math.min(state.pass[f.id] ?? passes.length - 1, passes.length - 1);
  const P = passes[pi];
  const showResolved = state.open.has(f.id + "#resolved");
  const passF = P ? [...P.findings].sort((a, b) => sev.indexOf(a.severity) - sev.indexOf(b.severity)) : [];
  const resolvedN = passF.filter(x => x.resolved).length;
  const allF = showResolved ? passF : passF.filter(x => !x.resolved);
  const showAll = state.open.has(f.id + "#findings");
  const shownF = showAll ? allF : allF.slice(0, 4);
  const sevCounts = sev.map(s => [s, allF.filter(x => x.severity === s).length]).filter(([, n]) => n);
  const passBar = passes.length ? `<div class="passes">${passes.length > 1 ? `<label class="dim" for="pass-${esc(f.id)}">Pass</label>
      <select id="pass-${esc(f.id)}" data-pass="${esc(f.id)}">${passes.map((p, i) => `<option value="${i}" ${i === pi ? "selected" : ""}>${i + 1} of ${passes.length}${i === passes.length - 1 ? " (latest)" : ""} · ${esc(p.label)}</option>`).join("")}</select>` : ""}
      ${P.gate ? `<span class="chip k-unlabeled">${esc(P.gate)}</span>` : ""}${verdict(P)}${pi < passes.length - 1 ? `<span class="chip calm">Earlier pass</span>` : ""}
      ${resolvedN ? `<button class="linkbtn" data-sess="${esc(f.id)}#resolved">${showResolved ? "Hide" : "Show"} ${resolvedN} resolved</button>` : ""}</div>` : "";
  const findings = f.review ? passBar + (allF.length ? `<div class="dfilters">${sevCounts.map(([s, n]) => `<span class="chip s-${s}">${n} ${s}</span>`).join("")}</div>` + shownF.map(x => `
      <div class="finding ${x.resolved ? "resolved" : ""}"><div class="fh"><span class="chip s-${x.severity}">${x.severity}</span><span class="mono">${esc(x.id)}</span>${x.owner ? `<span class="dim" style="font-size:11.5px">${esc(x.owner)}</span>` : ""}${x.status ? `<span class="dim" style="font-size:11.5px;margin-left:auto">${esc(x.status)}</span>` : ""}</div>
      <div>${esc(x.text)}</div>${x.fix ? `<div class="fix">Fix: ${esc(x.fix)}</div>` : ""}</div>`).join("") + (allF.length > 4 ? `<div class="finding"><button class="btn" data-sess="${esc(f.id)}#findings">${showAll ? "Show fewer" : `Show all ${allF.length} findings`}</button></div>` : "") : `<div class="none-msg">${passF.length ? "All findings in this pass are resolved." : "No findings in this pass."}</div>`) : `<div class="none-msg">No review.md yet.</div>`;
  const openInLatest = (latest(f)?.findings || []).filter(x => !x.resolved).length;

  const kinds = ["all", "agent", "flagged", "human", "unlabeled"];
  const sess = f.sessions.filter(s => state.dkind === "all" || s.kind === state.dkind);
  const decisions = f.sessions.length ? `<div class="dfilters">${kinds.map(k => {
      const n = k === "all" ? f.sessions.reduce((a, s) => a + s.n, 0) : c[k];
      return `<button class="${state.dkind === k ? "on" : ""}" data-dkind="${k}">${k === "all" ? "All" : KIND_LABEL[k]} · ${n}</button>`;
    }).join("")}</div>` + (sess.map((s, i) => {
      const key = f.id + "#s" + f.sessions.indexOf(s);
      return `<div class="session ${state.open.has(key) ? "open" : ""}"><div class="sh" data-sess="${esc(key)}"><span class="car">▶</span><span class="chip k-${s.kind}">${KIND_LABEL[s.kind]}</span><span class="sl">${esc(s.label)}</span><span class="dim" style="font-size:11.5px;white-space:nowrap">${esc(s.date || "")} · ${s.n} Q</span></div>
        <div class="qa">${s.qa.length ? s.qa.map(([q, a]) => `<div><div class="q">${esc(q)}</div><div class="a">${esc(a)}</div></div>`).join("") : `<div class="trimmed">${s.n ? "Q&amp;A text trimmed for finished specs in this mockup." : "No Q → A lines in this session."}</div>`}</div></div>`;
    }).join("") || `<div class="none-msg">None of this kind.</div>`) : `<div class="none-msg">No clarification sessions.</div>`;

  const docs = DOC_ORDER.filter(x => f.files.includes(x)).concat(f.files.filter(x => !DOC_ORDER.includes(x)));
  if (!docs.includes(state.docTab)) state.docTab = docs[0];
  const docBody = state.docTab === "spec.md" ? `<h3>${esc(f.title)}</h3><div class="dim">${esc(f.input || "")}</div>
      <dl><dt>Branch</dt><dd class="mono">${esc(f.branch || "—")}</dd><dt>Created</dt><dd>${esc(f.created || "—")}</dd><dt>Requirements</dt><dd>${f.fr} FR · ${f.nfr} NFR · ${f.sc} SC</dd><dt>User stories</dt><dd>${f.stories.length}</dd><dt>Contracts</dt><dd>${f.contracts} files</dd></dl>
      <div class="placeholder" style="margin-top:16px">Full rendered <span class="mono">spec.md</span> (markdown, tables, Mermaid) appears here in the app.</div>`
    : `<div class="placeholder">Rendered <span class="mono">${esc(state.docTab)}</span> appears here in the app.${state.docTab === "contracts" ? `<br>${f.contracts} contract files` : ""}</div>`;

  document.getElementById("main").innerHTML = `
    <div class="crumbs"><button data-back>‹ ${esc(DATA.project)}</button><span>/</span><span class="mono">${esc(f.ticket)}</span><span>/</span><span class="mono">${esc(f.slug)}</span></div>
    <div class="spechead"><div style="min-width:0;flex:1 1 380px">
        <h1>${esc(f.title)}</h1>
        <div class="meta">${pill(f.stage, f.stageSource)}<span class="tk">${esc(f.ticket)}</span>${f.branch ? `<span class="mono">⎇ ${esc(f.branch)}</span>` : ""}${RV.chip(f)}${f.created ? `<span>Created ${esc(f.created)}</span>` : ""}<span>Last commit ${ago(f.lastCommit)} ago</span>${f.clickup ? `<a href="${esc(f.clickup)}" target="_blank" rel="noopener">ClickUp ↗</a>` : ""}</div>
      </div>
      <div class="actions"><button class="btn" data-toast="Opened folder in editor">Open in editor</button><button class="btn" data-toast="Revealed in Finder">Reveal</button>${nextCmd ? `<button class="btn primary" data-copy="${nextCmd} specs/${esc(f.id)}">Copy ${nextCmd}</button>` : ""}</div>
    </div>
    ${f.status ? `<div class="statusnote"><b>${f.stageSource === "status" ? "Stage taken from this Status line (no tasks.md):" : "Status note (free text, from spec header):"}</b> ${esc(f.status)}</div>` : ""}
    ${stepper}
    <div class="kpis">
      <div class="card kpi"><div class="l">Tasks</div><div class="v">${t ? `${d}<span class="dim" style="font-size:14px">/${t}</span>` : "—"}</div><div class="s">${t ? Math.round(d / t * 100) + "% · " + f.phases.length + " phases" : "no tasks.md"}</div></div>
      <div class="card kpi ${f.next ? "clickable" : ""}" ${f.next ? `data-task="${esc(f.next[0])}"` : ""}><div class="l">Next task</div><div class="v mono" style="font-size:17px">${f.next ? esc(f.next[0]) : "—"}</div><div class="s" title="${esc(f.next?.[1] || "")}">${f.next ? esc(f.next[1]) : t ? "All tasks done" : "—"}</div></div>
      <div class="card kpi"><div class="l">Review</div><div class="v">${f.review?.verdict ? `<span class="verdict v-${f.review.verdict}" style="font-size:14px">${f.review.verdict}</span>` : "—"}</div><div class="s">${f.review ? `${latest(f).gate || "Latest pass"} · ${openInLatest} open` : "no review.md"}</div></div>
      <div class="card kpi"><div class="l">Decisions</div><div class="v">${c.agent + c.human + c.flagged + c.unlabeled}</div><div class="s"><span style="color:var(--agent)">${c.agent} agent</span> · <span style="color:var(--warn)">${c.flagged} flagged</span> · <span style="color:var(--ok)">${c.human} human</span></div></div>
      <div class="card kpi"><div class="l">Open questions</div><div class="v" style="${f.markers.length ? "color:var(--bad)" : ""}">${f.markers.length}</div><div class="s">${f.checklists[1] ? `Checklists ${f.checklists[0]}/${f.checklists[1]}` : "no checklists"}</div></div>
    </div>
    ${f.markers.length ? `<div class="card sect" style="padding:10px 14px;border-color:color-mix(in srgb, var(--bad) 40%, var(--line))">${f.markers.map(m => `<div>• ${esc(m)}</div>`).join("")}</div>` : ""}
    <div class="grid2">
      <div class="card panel"><header>Tasks by phase<span class="r">${t ? `${d} of ${t} done` : ""}</span></header>
        ${f.next ? `<div class="nextbox" data-task="${esc(f.next[0])}"><b>Next</b> <span class="mono">${esc(f.next[0])}</span> ${esc(f.next[1])}</div>` : ""}${phases}</div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="card panel"><header>User stories<span class="r">${f.stories.length} · progress from [US#] task tags</span></header>${stories}</div>
        <div class="card panel"><header>Review<span class="r">${f.review ? plural(passes.length, "pass") + " in review.md" : ""}</span></header>${findings}</div>
      </div>
    </div>
    <div class="card panel sect"><header>Decisions<span class="r">## Clarifications sessions, by who decided</span></header>${decisions}</div>
    <div class="sect">${RV.line(f, state.docTab)}${RV.grid(f, `<div class="card panel docs"><header>Documents<span class="r">${docs.length} artifacts</span></header>
      <div class="tabs">${docs.map(x => `<button class="${state.docTab === x ? "on" : ""}" data-doc="${esc(x)}">${esc(x)}${RV.tabCount(f, x)}</button>`).join("")}</div>
      <div class="body">${docBody}</div></div>`)}</div>`;
}

function render() {
  if (startView()) return;
  document.getElementById("wtitle").textContent = state.view === "spec" ? `${DATA.project} — ${byId[state.spec].id}` : `${DATA.project} — Spec Deck`;
  renderSide();
  state.view === "spec" ? renderSpec() : renderProject();
  renderModal();
  RV.afterRender(state.view === "spec" ? byId[state.spec] : null, state.docTab);
}

function toast(html) {
  const t = document.getElementById("toast"); t.innerHTML = html; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1800);
}

document.addEventListener("click", e => {
  if (RV.click(e)) return;
  const el = e.target.closest("[data-openpath],[data-close],[data-mnav],[data-task],[data-story],[data-tlset],[data-tltoday],[data-tlgroup],[data-zoom],[data-tlsel],[data-open],[data-nav],[data-stage],[data-group],[data-back],[data-toggle-done],[data-phase],[data-sess],[data-dkind],[data-doc],[data-copy],[data-toast]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.open) { location.hash = ds.open; return; }
  if (ds.zoom) { state.zoom = ds.zoom; state.tlCenter = true; render(); return; }
  if ("close" in ds) { state.modal = null; return renderModal(); }
  if (ds.mnav) return stepModal(+ds.mnav);
  if (ds.task && state.spec) { state.modal = { type: "task", spec: state.spec, key: ds.task }; return renderModal(); }
  if (ds.story && state.spec) { state.modal = { type: "story", spec: state.spec, key: ds.story }; return renderModal(); }
  if (ds.tlset) { const [k, v] = ds.tlset.split(":"); state[k] = v; state.tlCenter = true; render(); return; }
  if ("tltoday" in ds) { state.tlSel = null; state.tlCenter = true; render(); return; }
  if (ds.tlgroup != null) { state.tlCollapsed.has(ds.tlgroup) ? state.tlCollapsed.delete(ds.tlgroup) : state.tlCollapsed.add(ds.tlgroup); render(); return; }
  if (ds.tlsel) {
    const visible = document.querySelector(`.tr.tlrow[data-tlsel="${CSS.escape(ds.tlsel)}"]`);
    if (!visible && !el.classList.contains("row")) { location.hash = ds.tlsel; return; } // not on the timeline: open it
    const fromChip = el.classList.contains("ref");
    state.tlSel = state.tlSel === ds.tlsel && !fromChip ? null : ds.tlsel; if (fromChip) state.tlCenter = true; render(); return;
  }
  if (ds.nav) { if (ds.nav === "timeline") state.tlCenter = true; state.stage = null; return go(ds.nav); }
  else if (ds.stage) { state.stage = state.view === "project" && state.stage === ds.stage ? null : ds.stage; return go("all"); }
  else if (ds.group) state.group = ds.group;
  else if ("back" in ds) return go(state.nav);
  else if ("toggleDone" in ds) state.showDone = !state.showDone;
  else if (ds.phase) { const k = ds.phase; if (ds.auto === "1") state.open.add(k + "!"); else if (state.open.has(k)) state.open.delete(k); else state.open.add(k); }
  else if (ds.sess) { state.open.has(ds.sess) ? state.open.delete(ds.sess) : state.open.add(ds.sess); }
  else if (ds.dkind) state.dkind = ds.dkind;
  else if (ds.doc) state.docTab = ds.doc;
  else if (ds.copy) { const ok = () => toast(`Copied <code>${esc(ds.copy)}</code>`), no = () => toast(`Copy blocked here. Command: <code>${esc(ds.copy)}</code>`);
    try { navigator.clipboard.writeText(ds.copy).then(ok, no); } catch { no(); } return; }
  else if (ds.toast) { toast(esc(ds.toast) + " (mockup)"); return; }
  else if (ds.openpath) { openPath(ds.openpath); return; }
  render();
});
document.addEventListener("change", e => {
  if (e.target.dataset.pass) { state.pass[e.target.dataset.pass] = +e.target.value; render(); return; }
  if (!e.target.matches("[data-cnav]")) return;
  const [k, v] = e.target.value.split(":"); state.view = "project";
  if (k === "nav") { state.stage = null; go(v); } else { state.stage = v; go("all"); }
});

// Hash routes: a spec id, or a view name (timeline, waiting, unfinished, agent). Empty = All specs.
function go(nav) {
  const h = nav === "all" ? "" : nav;
  if (decodeURIComponent(location.hash.slice(1)) === h) { state.nav = nav; state.view = "project"; render(); }
  else location.hash = h;
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "welcome" || h === "splash") { state.view = h; render(); return; }
  if (state.modal && state.modal.spec !== h) state.modal = null;
  if (byId[h]) { if (state.spec !== h) { state.dkind = "all"; state.docTab = "spec.md"; } state.view = "spec"; state.spec = h; }
  else { state.view = "project"; state.nav = LISTS[h] ? h : "all"; }
  render();
  document.getElementById("win").scrollIntoView({ block: "start" });
}
addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (!state.modal) return RV.key(e);
  if (e.key === "Escape") { state.modal = null; renderModal(); }
  else if (e.key === "ArrowLeft") stepModal(-1);
  else if (e.key === "ArrowRight") stepModal(1);
});
// @start-handlers-start (mockup; scripts/make_ui.py swaps in the app's handlers)
document.addEventListener("click", e => {
  const el = e.target.closest("[data-recent],[data-forget],.start [data-pick],.side .open");
  if (!el) return;
  if (el.dataset.forget) { recents = recents.filter(r => r.path !== el.dataset.forget); return render(); }
  if (el.dataset.recent) {
    const r = recents.find(x => x.path === el.dataset.recent);
    if (r && r.name === DATA.project) { splashFor = r; state.view = "splash"; render(); setTimeout(() => { location.hash = ""; route(); }, 1600); }
    else toast(`Opens <code>${esc(el.dataset.recent)}</code> (mockup)`);
    return;
  }
  location.hash = "welcome"; // "Open project…" in the mockup shows the welcome view
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "o") { e.preventDefault(); toast("Opens the folder picker (mockup)"); }
});
for (const [ev, on] of [["dragover", true], ["dragleave", false], ["drop", false]]) {
  document.addEventListener(ev, e => {
    if (state.view !== "welcome") return;
    e.preventDefault();
    document.getElementById("drop")?.classList.toggle("over", on);
    if (ev === "drop") toast("Opens the dropped folder (mockup)");
  });
}
// @start-handlers-end
RV.loadCounts();
route();
</script>
</body>
</html>
